<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain Tumor Detection</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-image: url('/static/css/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            height: 100vh;
            overflow: hidden;
        }
        
        .container {
            color: white;
            max-width: 600px;
            margin: 50px auto;
            background: rgba(0, 0, 0, 0.5);
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            text-align: center;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        img {
            display: block;
            margin: 20px auto;
            max-width: 100%;
            max-height: 300px;
        }
        
        footer {
            height: 50px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="mt-5">Brain Tumor Detection</h1>
        <form method="post" enctype="multipart/form-data">
            <div class="form-group">
                <label for="file">Upload Segmented Image (JPG)</label>
                <input type="file" class="form-control" id="file" name="file" accept=".jpg, .jpeg" required>
            </div>
            <button type="submit" class="btn btn-primary">Upload</button>
        </form>
        {% if image_url %}
            <h2 class="mt-5">Uploaded Image:</h2>
            <img src="{{ image_url }}" class="img-fluid">
            <h3 class="mt-3">Prediction: {{ prediction }}</h3>
        {% endif %}
    </div>
    <footer></footer>
</body>
</html>
